[package]
name = "media_background"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lib]
path = "src/media_background.rs"

[lints]
workspace = true

[features]
bench-support = ["dep:gpui", "dep:gpui_apple", "gpui/bench-support", "gpui_apple/bench-support", "gpui_apple/runtime_shaders"]

[[example]]
name = "profile_background"
required-features = ["bench-support"]

[dependencies]
anyhow.workspace = true
fast_image_resize.workspace = true
futures.workspace = true
http_client.workspace = true
image.workspace = true
libc.workspace = true
log.workspace = true
parking_lot.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
tempfile.workspace = true
url.workspace = true
util.workspace = true

[dev-dependencies]
http_client = { workspace = true, features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { workspace = true, optional = true }
gpui_apple = { workspace = true, optional = true }
