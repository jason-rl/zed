name: Fork release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IDLE_TIMEOUT: "0"
  SCCACHE_LOG: warn

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - group: app
            files: zed cli zed.dwarf
          - group: remote-server
            files: remote_server remote_server.dwarf
    permissions:
      contents: read
    env:
      BUILD_GROUP: ${{ matrix.group }}
      ARTIFACT_FILES: ${{ matrix.files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          check-latest: true
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-targets: false
          key: ${{ matrix.group }}
      - name: Configure sccache error log
        run: echo "SCCACHE_ERROR_LOG=${RUNNER_TEMP}/sccache-error.log" >> "$GITHUB_ENV"
      - name: Set up sccache
        id: sccache
        continue-on-error: true
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      - name: Enable sccache
        if: steps.sccache.outcome == 'success'
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Record build resources
        run: |
          system_profiler SPHardwareDataType
          sysctl hw.memsize hw.ncpu
          df -h
      - name: Build binaries for Apple Silicon
        run: |
          record_resources() {
            while true; do
              date -u
              ps -axo pid,ppid,rss,comm | awk 'NR == 1 || /rustc|cargo|sccache|\/ld$|dsymutil/'
              sysctl vm.swapusage
              vm_stat
              sleep 30
            done
          }
          record_resources > "${RUNNER_TEMP}/build-resources.log" 2>&1 &
          resource_monitor_pid=$!
          trap '
            if ! kill "$resource_monitor_pid" 2>/dev/null; then
              echo "::warning::Resource monitor exited before the build finished"
            fi
            wait "$resource_monitor_pid" || true
          ' EXIT
          set +e
          ./script/bundle-mac -b "$BUILD_GROUP" aarch64-apple-darwin
          build_status=$?
          set -e
          if [[ "${RUSTC_WRAPPER:-}" == "sccache" ]]; then
            if ! sccache --show-stats; then
              echo "::warning::Unable to read sccache statistics"
            fi
          fi
          exit "$build_status"
      - name: Archive binaries and debug symbols
        run: |
          read -r -a artifact_files <<< "$ARTIFACT_FILES"
          tar -czf "${RUNNER_TEMP}/macos-${BUILD_GROUP}.tar.gz" \
            -C target/aarch64-apple-darwin/release "${artifact_files[@]}"
      - name: Upload binaries and debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-${{ matrix.group }}
          path: ${{ runner.temp }}/macos-${{ matrix.group }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Record final resources
        if: always()
        run: |
          top -l 1 -stats pid,command,cpu,mem
          df -h
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-diagnostics-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/build-resources.log
            ${{ runner.temp }}/sccache-error.log
            target/cargo-timings/
            target/dsymutil-*.log

  package:
    needs: build
    runs-on: macos-26
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          check-latest: true
      - name: Cache Rust dependencies and packaging tools
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-targets: false
      - name: Download binaries and debug symbols
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: macos-*
          merge-multiple: true
          path: ${{ runner.temp }}/macos-artifacts
      - name: Restore binaries and debug symbols
        run: |
          mkdir -p target/aarch64-apple-darwin/release
          for group in app remote-server; do
            tar -xzf "${RUNNER_TEMP}/macos-artifacts/macos-${group}.tar.gz" \
              -C target/aarch64-apple-darwin/release
          done
      - name: Package Zed for Apple Silicon
        run: ./script/bundle-mac -p aarch64-apple-darwin
      - name: Upload disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Zed-aarch64.dmg
          path: target/aarch64-apple-darwin/release/Zed-aarch64.dmg
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Download disk image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Zed-aarch64.dmg
          path: .
      - name: Determine release version
        run: |
          version="$(sed -n '/^version = "/ { s/^version = "\([^"]*\)"/\1/p; q; }' crates/zed/Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_ENV"
      - name: Replace release for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --cleanup-tag --yes
          fi
          gh release create "$tag" "Zed-aarch64.dmg" \
            --target "$GITHUB_SHA" \
            --title "$version" \
            --latest \
            --generate-notes
